<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Exporter</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #ffffff;
      color: #333;
      transition: background-color 0.3s, color 0.3s;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #0078d4;
    }
    
    .info {
      background-color: #f0f0f0;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 12px;
      word-break: break-all;
    }
    
    .domain {
      font-weight: bold;
      color: #0078d4;
    }
    
    button {
      width: 100%;
      padding: 10px;
      background-color: #0078d4;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    button:hover {
      background-color: #005a9e;
    }
    
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 5px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    
    .status.success {
      background-color: #d4edda;
      color: #155724;
      display: block;
    }
    
    .status.error {
      background-color: #f8d7da;
      color: #721c24;
      display: block;
    }
    
    .cookie-count {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    
    .footer {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid #e0e0e0;
      font-size: 10px;
      color: #1c1c1c;
      text-align: center;
    }
    
    .footer a {
      color: #0600aa;
      text-decoration: underline;
    }
    
    .footer a:hover {
      text-decoration: underline;
    }
    
    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
        color: #e0e0e0;
      }
      
      h1 {
        color: #4db8ff;
      }
      
      .info {
        background-color: #2d2d2d;
        color: #e0e0e0;
      }
      
      .domain {
        color: #4db8ff;
      }
      
      .cookie-count {
        color: #b0b0b0;
      }
      
      button {
        background-color: #0078d4;
      }
      
      button:hover {
        background-color: #1e8ad6;
      }
      
      button:disabled {
        background-color: #555;
        color: #888;
      }
      
      .status.success {
        background-color: #1a4d2e;
        color: #a7d8b3;
      }
      
      .status.error {
        background-color: #5c1f1f;
        color: #f0a3a3;
      }
      
      .footer {
        border-top-color: #3d3d3d;
        color: #999;
      }
      
      .footer a {
        color: #6da3ff;
      }
    }
  </style>
</head>
<body>
<h1><img src="icons/icon.svg" alt="Cookie" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 5px;"> Cookie Exporter</h1>
  
  <div class="info">
    <div>Current Domain:</div>
    <div class="domain" id="domain">Loading...</div>
    <div class="cookie-count" id="cookieCount"></div>
  </div>
  
  <button id="exportBtn">Export Cookies</button>
  
  <div class="status" id="status"></div>
  
  <div class="footer">
    <span style="opacity: 0.6;">v{{version}} | © {{copyright}} SaltSpectre<br>
    Extension logo by <a href="https://icons8.com" target="_blank">Icons8</a></span><br>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
